# NFPD Appeals Bot - self-hosted deployment.
#
# PostgreSQL is NOT defined here. It is expected to already be running as the
# `appeals-postgres` container on the shared `nodey-monitoring` network. This
# compose file defines only the bot service.

services:
  nfpd-appeals-bot:
    build: .
    image: nfpd-appeals-bot:latest
    container_name: nfpd-appeals-bot
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - nodey-monitoring
    # tini in the image already gives us proper PID 1 - do NOT enable
    # `init: true` here or we would end up with two init processes.
    stop_grace_period: 30s
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${BOT_MEM_LIMIT:-256m}
    memswap_limit: ${BOT_MEM_LIMIT:-256m}
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # Probes /ready (Discord logged in AND PostgreSQL answering) on the
      # in-container health server. The port is NOT published to the host.
      # An unhealthy container is flagged in `docker ps`; Docker does not
      # restart it for that alone - `restart: unless-stopped` covers crashes.
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  nodey-monitoring:
    external: true
